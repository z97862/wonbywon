<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 돈 데스크톱</title>
<meta name="theme-color" content="#f8c3d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 돈">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Nanum Gothic Coding',monospace;color:#000;background-color:#fffdf7;background-image:linear-gradient(90deg,#fff0a0 2px,transparent 2px),linear-gradient(#fff0a0 2px,transparent 2px),repeating-conic-gradient(#f8c3d6 0 25%,#fffdf7 0 50%);background-size:32px 32px,32px 32px,64px 64px;background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:440px;margin:0 auto;padding:14px 12px 120px;position:relative}
.win{background:#c3c3c3;border:2px solid;border-color:#fff #424242 #424242 #fff;box-shadow:1px 1px 0 #000;margin-bottom:14px}
.tb{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 8px;font-weight:700;font-size:13px}
.tb.navy{background:linear-gradient(90deg,#14148c,#3a6fd8);color:#fff}
.tb.lime{background:#c6e84a}.tb.sky{background:#2aa8f0}.tb.orange{background:#ff7a3d}.tb.mint{background:#1baf7a}.tb.pink{background:#ff9ec4}
.tb .xs{display:flex;gap:2px}
.xb{width:20px;height:18px;background:#c3c3c3;border:2px solid;border-color:#fff #424242 #424242 #fff;font:700 11px/12px 'Nanum Gothic Coding',monospace;padding:0;cursor:pointer}
.menu{display:flex;gap:14px;padding:3px 8px;font-size:12px}
.body{padding:6px 10px 12px}
.in{background:#fff;border:2px solid;border-color:#424242 #fff #fff #424242}
.flat{background:#c3c3c3}
.btn{background:#c3c3c3;border:2px solid;border-color:#fff #424242 #424242 #fff;box-shadow:1px 1px 0 #000;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:active{border-color:#424242 #fff #fff #424242;box-shadow:none}
.btn.def{font-weight:700;outline:1px dotted #000;outline-offset:-5px}
.btn.sm{padding:3px 8px;font-size:12px}
.pix{font-family:'VT323',monospace;letter-spacing:.5px}
.hand{font-family:'Gaegu',cursive}
.lcd{background:#0f1f10;border:2px solid;border-color:#424242 #fff #fff #424242;padding:10px 14px 6px;color:#a8f0a0}
.lcd .big{font-family:'VT323',monospace;font-size:clamp(40px,12vw,58px);line-height:1;color:#7dff7a;white-space:nowrap}
.lcd .big.neg{color:#ff8fa8}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.small{font-size:12px}.tiny{font-size:11px}.muted{color:#424242}
.seg{height:16px;border:1px solid #424242;padding:1px;background:#fff;position:relative}
.seg>i{display:block;height:100%}
.marker{position:absolute;top:-5px;bottom:-5px;width:2px;background:#e0245e}
.note{position:relative;background:#fff;border:2px solid #222;box-shadow:3px 3px 0 #222;padding:10px 12px;font-family:'Gaegu',cursive;font-size:19px;line-height:1.3}
.note::before{content:"";position:absolute;left:50%;top:-10px;width:56px;height:16px;margin-left:-28px;background:var(--tape,#9fd8ff);opacity:.85;transform:rotate(-4deg)}
.buddy{display:flex;align-items:center;gap:6px;margin:4px 0 18px}
.buddy svg{width:116px;height:116px;flex:none}
.buddy .note{flex:1}
.list .it{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dotted #9a9a9a;font-size:13px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list .it:last-child{border-bottom:0}
.dot{width:10px;height:10px;border:1px solid #222;flex:none;display:inline-block}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 4px}
.icon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:none;border:0;cursor:pointer;padding:4px 2px}
.icon:hover .nm,.icon:focus .nm{background:#1f1fa0;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#fff;border:2px solid;border-color:#424242 #fff #fff #424242;padding:5px 8px;font-size:12px;cursor:pointer}
.chip.on{background:#1f1fa0;color:#fff}
.field{width:100%;padding:7px 8px;font-size:15px}
label.lb{display:block;font-size:12px;margin:10px 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.day{position:relative;height:52px;border:1.5px solid #222;border-radius:6px 9px 7px 10px;background:#fff;padding:3px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-family:'Gaegu',cursive;text-align:left}
.day.empty{border:1.5px dashed #c0c0c0;cursor:default;background:transparent}
.day.over{background:#ffe3ec}
.day.today{border:2.5px solid #1f1fa0}
.day.sel{outline:2px dotted #e0245e;outline-offset:1px}
.day .n{font-size:15px;line-height:1}
.day .a{font-family:'VT323',monospace;font-size:14px;line-height:1;text-align:right;white-space:nowrap}
.day .st{position:absolute;right:2px;top:2px;width:13px;height:13px}
.task{position:fixed;left:0;right:0;bottom:0;background:#c3c3c3;border-top:2px solid #fff;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:5}
.task .in2{max-width:440px;margin:0 auto;display:flex;gap:3px;align-items:center}
.tab{flex:1;text-align:center;font-size:12px;padding:8px 0;background:#c3c3c3;border:2px solid;border-color:#fff #424242 #424242 #fff;cursor:pointer}
.tab[aria-selected="true"]{font-weight:700;background:#e8e8e8;border-color:#424242 #fff #fff #424242}
.clock{padding:7px 5px;font-size:11px;background:#c3c3c3;border:2px solid;border-color:#424242 #fff #fff #424242}
.fab{position:fixed;right:max(14px,calc(50% - 206px));bottom:74px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;cursor:pointer}
.fab .ic{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:#fffdf7;border:2px solid #222;border-radius:12px;box-shadow:3px 3px 0 #222}
.fab .lb2{font-size:11px;background:#1f1fa0;color:#fff;padding:1px 4px}
.scrim{position:fixed;inset:0;background:rgba(60,40,60,.35);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:24px 10px 40px}
.scrim.open{display:flex}
.dlg{width:100%;max-width:420px}
.tabs{display:flex;position:relative;z-index:1}
.tabs button{background:#c3c3c3;border:2px solid;border-color:#fff #424242 transparent #fff;border-radius:4px 4px 0 0;padding:5px 12px 4px;margin-top:3px;font-size:13px;cursor:pointer}
.tabs button.on{padding:7px 14px 8px;margin-top:0;font-weight:700;z-index:2}
.panel{border:2px solid;border-color:#fff #424242 #424242 #fff;margin-top:-2px;padding:12px 10px}
fieldset{margin:12px 0 0;border:2px groove #fff;padding:6px 10px 8px;font-size:12px;line-height:1.6}
legend{padding:0 4px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#1f1fa0;color:#fff;padding:8px 14px;font-size:13px;border:2px solid #fff;box-shadow:2px 2px 0 #000;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.sparkle{position:absolute;pointer-events:none}
[hidden]{display:none!important}
.warn{color:#a3103e;font-weight:700}
.status{font-size:11px;text-align:center;color:#424242;margin-top:-6px;margin-bottom:10px}
</style>
</head>

<div class="wrap">
  <div class="status" id="status">불러오는 중…</div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" type="button" aria-label="새 기록">
  <span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"></path><path d="M14 6l3 3"></path></svg></span>
  <span class="lb2">새기록.exe</span>
</button>

<nav class="task"><div class="in2" role="tablist">
  <span class="btn sm" style="font-weight:700;display:flex;align-items:center;gap:3px;box-shadow:none"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5L12 16.8 6.1 20l1.3-6.5L2.5 8.9l6.6-.8z" fill="#ff8fb8" stroke="#222" stroke-width="1.6"></path></svg>시작</span>
  <button class="tab" role="tab" data-v="today">오늘</button>
  <button class="tab" role="tab" data-v="money">내 돈</button>
  <button class="tab" role="tab" data-v="pay">월급</button>
  <button class="tab" role="tab" data-v="cal">달력</button>
  <span class="clock" id="clock">--:--</span>
</div></nav>

<div class="scrim" id="scrim"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Math.round(n).toLocaleString('ko-KR');
const man = n => { const a=Math.abs(n), s=n<0?'-':''; if(a>=1e8){return s+(Math.round(a/1e7)/10)+'억';} if(a>=1e4){const v=Math.round(a/1e3)/10; return s+(v%1?v:Math.round(v))+'만';} return s+won(a); };
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a,b) => Math.round((parseD(fmt(b))-parseD(fmt(a)))/864e5);
const WD = ['일','월','화','수','목','금','토'];
const md = d => (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }

/* Korean public holidays (incl. substitute days) */
const HOL = new Set(['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-02','2026-05-05','2026-05-25','2026-06-03','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-10-05','2026-10-09','2026-12-25',
 '2027-01-01','2027-02-08','2027-02-09','2027-03-01','2027-05-05','2027-05-13','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-04','2027-10-11','2027-12-27','2027-12-25',
 '2028-01-01','2028-01-26','2028-01-27','2028-01-28','2028-03-01','2028-05-02','2028-05-05','2028-06-06','2028-08-15','2028-10-02','2028-10-03','2028-10-04','2028-10-05','2028-10-09','2028-12-25']);
const isOff = d => d.getDay()===0 || d.getDay()===6 || HOL.has(fmt(d));
function payDate(y,m){ const day=state.settings.payDay||25; let d=new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate())); while(isOff(d)) d=addDays(d,-1); return d; }
function periodOf(t){
  const y=t.getFullYear(), m=t.getMonth(), p=payDate(y,m); let start,end;
  if (dayDiff(p,t)>=0){ start=p; end=addDays(payDate(y,m+1),-1); } else { start=payDate(y,m-1); end=addDays(p,-1); }
  return {start, end, next:addDays(end,1), days:dayDiff(start,end)+1};
}

/* ================= state ================= */
let BUCKETS = [];
let BCOL = {};
const PALETTE = ['#eda100','#ff7a3d','#ff8fb8','#9db6ea','#1baf7a','#8f8e88','#2a78d6','#c6e84a'];
function syncBuckets(){
  const st=state.settings; if(!st.bucketOrder) st.bucketOrder=Object.keys(st.budgets||{});
  st.bucketOrder=st.bucketOrder.filter(b=>b in st.budgets);
  Object.keys(st.budgets).forEach(b=>{ if(!st.bucketOrder.includes(b)) st.bucketOrder.push(b); });
  BUCKETS=st.bucketOrder.slice(); BCOL={}; BUCKETS.forEach((b,i)=>BCOL[b]=PALETTE[i%PALETTE.length]);
}
const V2_BUDGETS = {'식비':400000,'생활비':100000,'경조사':100000,'문화생활':150000,'미용/의류':200000,'통신·보험·미정':100000};
const V2_SUBCATS = [['식사','식비'],['카페/간식','식비'],['배달','식비'],['장보기','식비'],['생필품','생활비'],['생활 기타','생활비'],['생일·선물','경조사'],['축의/부의','경조사'],['취미(기타·밴드)','문화생활'],['공연/영화','문화생활'],['놀거리','문화생활'],['옷','미용/의류'],['미용실','미용/의류'],['화장품','미용/의류'],['통신비','통신·보험·미정'],['보험','통신·보험·미정'],['미정','통신·보험·미정']];
function migrate(){
  if(!state.settings) return;
  const startV=state.v||1;
  if(startV<2){
    const st=state.settings; st.budgets={...V2_BUDGETS}; st.bucketOrder=Object.keys(V2_BUDGETS);
    const rename={'장보기/생필품':'생필품','구독':'미정'};
    (state.entries||[]).forEach(e=>{ if(e.sub&&rename[e.sub]) e.sub=rename[e.sub]; });
    Object.keys(state.learned||{}).forEach(k=>{ if(rename[state.learned[k]]) state.learned[k]=rename[state.learned[k]]; });
    const OLD=['식사','카페/간식','배달','장보기/생필품','취미(기타·밴드)','공연/영화','구독','놀거리','옷','미용실','화장품','생일·선물','축의/부의'];
    const extra=(state.subcats||[]).filter(c=>!OLD.includes(c.name)&&!V2_SUBCATS.some(([n])=>n===c.name));
    state.subcats=V2_SUBCATS.map(([name,bucket])=>({name,bucket}));
    extra.forEach(c=>{ if(!state.subcats.some(x=>x.name===c.name)) state.subcats.push({name:c.name,bucket:'통신·보험·미정'}); });

function parseText(txt){
  let s=txt.trim(), amount=0;
  const m = s.match(/(\d[\d,\.]*)\s*(만)\s*(\d[\d,]*)?\s*(천)?\s*원?|(\d[\d,\.]*)\s*(천)\s*원?|(\d[\d,\.]*)\s*(k|K)|(\d[\d,]*)\s*원?/);
  if(m){
    if(m[2]){ amount=parseFloat(m[1].replace(/,/g,''))*10000 + (m[3]?(+m[3].replace(/,/g,''))*(m[4]?1000:1):0); }
    else if(m[6]){ amount=parseFloat(m[5].replace(/,/g,''))*1000; }
    else if(m[8]){ amount=parseFloat(m[7].replace(/,/g,''))*1000; }
    else { amount=+m[9].replace(/,/g,''); }
    s=(s.slice(0,m.index)+' '+s.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim();
  }
  return {amount:Math.round(amount), memo:s};
}
function classify(memo){
  const low=memo.toLowerCase().replace(/\s+/g,'');
  if(!low) return null;
  for(const k of Object.keys(state.learned).sort((a,b)=>b.length-a.length)){ if(low.includes(k) && state.subcats.some(s=>s.name===state.learned[k])) return {sub:state.learned[k],src:'기억'}; }
  for(const [sub,words] of RULES){ if(!state.subcats.some(s=>s.name===sub)) continue; for(const w of words){ if(low.includes(w)) return {sub,src:'단어'}; } }
  return null;
}
async function askClaude(memo, amount){
  if(!sample) return null;
  const list=state.subcats.map(s=>`${s.name} (${s.bucket})`).join(', ');
  const prompt=`한국 20대 직장인의 지출 한 건을 분류해줘.\n지출 메모: "${memo}"\n금액: ${amount}원\n기존 세부분류: ${list}\n예산 칸은 ${BUCKETS.join(', ')} 네 개뿐이야.\n기존 세부분류 중 맞는 게 있으면 그걸 고르고, 정말 안 맞으면 새 세부분류 이름(짧게)과 속할 예산 칸을 제안해.\nJSON으로만 답해: {"sub":"세부분류 이름","bucket":"예산 칸","isNew":true|false}`;
  try{
    const r = await sample.json(prompt,{modelTier:'quick'});
    if(r && r.sub && BUCKETS.includes(r.bucket)) return {sub:String(r.sub).slice(0,20), bucket:r.bucket, isNew:!!r.isNew && !state.subcats.some(s=>s.name===r.sub), src:'Claude'};
  }catch(e){ if(e&&e.code==='not_granted') sample=null; console.warn(e); }
  return null;
}

        </div></div>`) + `<div class="buddy" style="margin-top:8px">${buddySvg}<div class="note" style="--tape:#c6e84a;transform:rotate(-2deg);font-size:17px">${move?'어디로 옮겼는지 적으면<br>체크리스트도 내가 챙길게!':'한 줄만 적어 줘,<br>분류는 내가 할게 ☆'}</div></div>`);
    bindClose();
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ d.type=b.dataset.mode; if(d.type==='move'&&!d.to) d.from=liveAcc(); draw(); });
    const q=$('#qtext');
    if(q){
      if(!ed) setTimeout(()=>q.focus(),30);
      let tmr;
      q.oninput=()=>{ const p=parseText(q.value); d.amount=p.amount; d.memo=p.memo; const cl=classify(p.memo); if(cl){ d.sub=cl.sub; srcLabel=cl.src; } else if(srcLabel!=='직접') { srcLabel=''; }
        const caret=q.selectionStart; draw(); const q2=$('#qtext'); q2.value=q.value; q2.focus(); try{q2.setSelectionRange(caret,caret);}catch(e){} };
      q.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#saveBtn').click(); } };
    }
    const fs=$('#fsub'); if(fs) fs.onchange=()=>{ if(fs.value==='__new'){ newSubPrompt(name=>{ d.sub=name; srcLabel='직접'; draw(); }, ()=>draw()); return; } d.sub=fs.value; srcLabel='직접'; draw(); };
    const ai=$('#aiBtn'); if(ai) ai.onclick=async()=>{ if(!d.memo){toast('먼저 뭐에 썼는지 적어 주세요');return;} aiPending=true; draw(); const r=await askClaude(d.memo,d.amount); aiPending=false; applyAI(r); draw(); };
    const fd=$('#fdate'); if(fd) fd.onchange=()=>{ d.date=fd.value||fmt(new Date()); draw(); };
    const ff=$('#ffrom'); if(ff) ff.onchange=()=>{ d.from=ff.value; draw(); };
    const ft=$('#fto'); if(ft) ft.onchange=()=>{ d.to=ft.value; draw(); };
    const fm=$('#fmemo'); if(fm) fm.oninput=()=>{ d.memo=fm.value; };
    const fa=$('#famt'); if(fa){ fa.onchange=()=>{ d.amount=+fa.value.replace(/[^0-9]/g,'')||0; draw(); }; fa.oninput=()=>{ const v=+fa.value.replace(/[^0-9]/g,'')||0; fa.value=v?won(v):''; d.amount=v; }; }
    document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{ d.amount+=(+b.dataset.plus); draw(); });
    const del=$('#delBtn'); if(del) del.onclick=()=>{ if(!del.dataset.arm){ del.dataset.arm=1; del.textContent='정말 삭제?'; return; } state.entries=state.entries.filter(e=>e.id!==ed.id); persist(); closeDlg(); render(); toast('삭제했어요'); };
    $('#saveBtn').onclick=async()=>{
      if(!d.amount){ toast('금액을 적어 주세요'); return; }
      if(d.type==='spend'){
        if(!d.sub){ if(sample && d.memo){ aiPending=true; draw(); const r=await askClaude(d.memo,d.amount); aiPending=false; applyAI(r); if(!d.sub){ draw(); toast('분류를 골라주세요'); return; } } else { toast('분류를 골라주세요'); return; } }
        if(srcLabel==='직접' || srcLabel==='Claude'){ const key=(d.memo||'').toLowerCase().replace(/\s+/g,'').slice(0,12); if(key.length>=2) state.learned[key]=d.sub; }
        d.bucket=subBucket(d.sub); d.src=srcLabel;
      }
      if(d.type==='move'){ if(!d.to){ toast('어디로 옮겼는지 골라주세요'); return; } if(d.to===d.from){ toast('보내는 곳과 받는 곳이 같아요'); return; } }
      const rec={...d};
      if(ed){ const i=state.entries.findIndex(e=>e.id===ed.id); state.entries[i]=rec; } else { rec.id=uid(); state.entries.push(rec); }
      persist(); closeDlg(); render(); toast(ed?'고쳤어요':'기록했어요 ☆');
    };
  };
  function applyAI(r){
    if(!r){ toast('자동 분류를 못 했어요. 직접 골라주세요'); return; }
    if(r.isNew){ state.subcats.push({name:r.sub,bucket:r.bucket}); toast(`새 분류 "${r.sub}" (${r.bucket}) 추가`); }
    d.sub=r.sub; srcLabel='Claude';
  }
  draw();
}
function newSubPrompt(ok, cancel){
  const prev=$('#dlg').innerHTML;
  const box=document.createElement('div');
  box.innerHTML=`<fieldset style="background:#c3c3c3"><legend>새 분류</legend><label class="lb" for="nsn">이름</label><input id="nsn" class="in field" placeholder="예: 운동"><label class="lb" for="nsb">예산 칸</label><select id="nsb" class="in field">${BUCKETS.map(b=>`<option>${b}</option>`).join('')}</select><div style="display:flex;justify-content:flex-end;gap:6px;margin-top:8px"><button type="button" class="btn def" id="nsOk">추가</button><button type="button" class="btn" id="nsNo">취소</button></div></fieldset>`;
  $('#dlg .panel').prepend(box); $('#nsn').focus();
  $('#nsNo').onclick=()=>{ box.remove(); cancel(); };
  $('#nsOk').onclick=()=>{ const n=$('#nsn').value.trim().slice(0,20); if(!n){toast('이름을 적어 주세요');return;} if(!state.subcats.some(s=>s.name===n)) state.subcats.push({name:n,bucket:$('#nsb').value}); persist(); box.remove(); ok(n); };
}
function openAccount(id){
  const a = id ? state.accounts.find(x=>x.id===id) : {id:null,name:'',purpose:'save',start:0};
  const bal = id ? balances()[id] : 0;
  openDlg(dlgWin(id?esc(a.name)+' 속성':'새 계좌',`<div class="panel">
    <label class="lb" for="an">이름</label><input id="an" class="in field" value="${esc(a.name)}">
    <label class="lb">용도</label><div class="chips">${Object.keys(PNAME).map(k=>`<button type="button" class="chip ${a.purpose===k?'on':''}" data-p="${k}">${PNAME[k]}</button>`).join('')}</div>
    <label class="lb" for="ab">지금 잔액 (실제 통장 금액으로 맞추기)</label><input id="ab" class="in field pix" style="font-size:26px;text-align:right" inputmode="numeric" value="${won(bal)}">
    <div class="tiny muted" style="margin-top:4px">기록과 실제 잔액이 다르면 여기서 맞춰 주세요. 지출 기록은 그대로 남아요.</div>
    <div style="display:flex;justify-content:space-between;margin-top:14px"><span>${id?'<button type="button" class="btn" id="adel">삭제</button>':''}</span><span style="display:flex;gap:6px"><button type="button" class="btn def" id="aok">확인</button><button type="button" class="btn" data-close>취소</button></span></div></div>`));
  bindClose();
  let purpose=a.purpose;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ purpose=b.dataset.p; document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#ab').oninput=e=>{ const v=(e.target.value.trim().startsWith('-')?-1:1)*(+e.target.value.replace(/[^0-9]/g,'')||0); e.target.value=(v<0?'-':'')+won(Math.abs(v)); };
  $('#aok').onclick=()=>{
    const name=$('#an').value.trim(); if(!name){toast('이름을 적어 주세요');return;}
    const raw=$('#ab').value; const want=(raw.trim().startsWith('-')?-1:1)*(+raw.replace(/[^0-9]/g,'')||0);
    if(id){ a.name=name; a.purpose=purpose; a.start += want-bal; }
    else state.accounts.push({id:uid(),name,purpose,start:want});
    persist(); closeDlg(); render(); toast('저장했어요');
  };
  const del=$('#adel'); if(del) del.onclick=()=>{ if(!del.dataset.arm){del.dataset.arm=1;del.textContent='정말 삭제?';return;} state.accounts=state.accounts.filter(x=>x.id!==id); state.plan=state.plan.filter(p=>p.to!==id); persist(); closeDlg(); render(); };
}
function openSettings(){
  syncBuckets();
  const s=state.settings;
  const row=(lbl,key,val,extra='')=>`<div class="row small" style="margin-top:6px"><label for="${key}" style="flex:1">${lbl}</label><input id="${key}" class="in pix" style="width:130px;font-size:20px;text-align:right;padding:2px 6px" inputmode="numeric" value="${won(val)}" ${extra}></div>`;
  openDlg(dlgWin('예산 설정',`<div class="panel">
    <fieldset style="margin-top:0"><legend>지출 예산 (하루 여유 계산 기준)</legend>${BUCKETS.map((b,i)=>row(esc(b),'b'+i,s.budgets[b])).join('')}
      <div class="row small" style="margin-top:8px;gap:4px"><input id="nbName" class="in" style="flex:1;padding:4px" placeholder="새 예산 칸 이름"><button type="button" class="btn sm" id="nbAdd">+ 칸 추가</button></div>
      <div class="chips" style="margin-top:6px">${BUCKETS.map((b,i)=>`<button type="button" class="chip" data-delbk="${i}">${esc(b)} ×</button>`).join('')}</div><div class="tiny muted" style="margin-top:6px" id="dailyHint"></div></fieldset>
    <fieldset><legend>정기 지출 칸 (하루 여유에서 미리 빼 둘 돈)</legend><div class="chips">${BUCKETS.map(b=>`<button type="button" class="chip ${(s.regular||[]).includes(b)?'on':''}" data-reg="${esc(b)}">${esc(b)}</button>`).join('')}</div>
      ${(s.regular||[]).filter(b=>BUCKETS.includes(b)).map(b=>`<div class="row small" style="margin-top:6px"><label for="dd_${esc(b)}" style="flex:1">${esc(b)} 납부일 (없으면 비워두기)</label><input id="dd_${esc(b)}" data-dd="${esc(b)}" class="in" style="width:60px;font-size:16px;text-align:right;padding:2px 6px" inputmode="numeric" value="${(s.dueDays||{})[b]||''}"></div>`).join('')}
      <div class="tiny muted" style="margin-top:6px">정기 칸은 매달 이만큼은 나간다고 보고 미리 빼 둬요. 낼 때마다 기록하고, 예산보다 더 나가면 그만큼만 하루 여유에서 줄어요.</div></fieldset>
    <fieldset><legend>월급날 옮길 돈</legend>${state.plan.map((p,i)=>row(esc(accName(p.to)),'p'+i,p.amount)).join('')}
      <div class="row small" style="margin-top:8px"><select id="npTo" class="in" style="flex:1;padding:4px">${state.accounts.filter(a=>a.purpose!=='live'&&!state.plan.some(p=>p.to===a.id)).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><button type="button" class="btn sm" id="npAdd">+ 추가</button></div></fieldset>
    <fieldset><legend>기타</legend>${row('비상금 목표','eg',s.emgGoal)}<div class="row small" style="margin-top:6px"><label for="pd" style="flex:1">월급일 (주말·공휴일이면 직전 영업일)</label><input id="pd" class="in pix" style="width:60px;font-size:20px;text-align:right;padding:2px 6px" inputmode="numeric" value="${s.payDay}"></div></fieldset>
    <fieldset><legend>세부 분류</legend><div class="chips">${state.subcats.map((c,i)=>`<button type="button" class="chip" data-delsub="${i}" title="눌러서 삭제">${esc(c.name)} · ${c.bucket.slice(0,2)} ×</button>`).join('')}</div></fieldset>
    <fieldset><legend>백업</legend><div style="display:flex;gap:6px"><button type="button" class="btn sm" id="bkCopy">백업 복사</button><button type="button" class="btn sm" id="bkRestore">붙여넣어 복원</button><button type="button" class="btn sm" id="lgOut">로그아웃</button></div><textarea id="bkText" class="in" style="width:100%;height:60px;margin-top:6px;font-size:11px" hidden placeholder="백업 텍스트를 붙여넣고 다시 '붙여넣어 복원'을 누르세요"></textarea></fieldset>
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:14px"><button type="button" class="btn def" id="sok">확인</button><button type="button" class="btn" data-close>취소</button></div></div>`));
  bindClose();
  const num=id=>+($('#'+id).value.replace(/[^0-9]/g,''))||0;
  const hint=()=>{ const t=BUCKETS.reduce((a,b,i)=>a+num('b'+i),0); $('#dailyHint').textContent=`합계 ${won(t)}원 · 30일 기준 하루 약 ${won(t/30)}원`; };
  document.querySelectorAll('#dlg input.pix').forEach(i=>i.addEventListener('input',()=>{ if(i.id==='pd') return; const v=+i.value.replace(/[^0-9]/g,'')||0; i.value=v?won(v):''; hint(); }));
  hint();
  document.querySelectorAll('[data-delsub]').forEach(b=>b.onclick=()=>{ if(!b.dataset.arm){b.dataset.arm=1;b.textContent='삭제?';return;} state.subcats.splice(+b.dataset.delsub,1); persist(); openSettings(); });
  $('#nbAdd').onclick=()=>{ const n=$('#nbName').value.trim().slice(0,12); if(!n||BUCKETS.includes(n)){ toast('이름을 확인해 주세요'); return; } BUCKETS.forEach((b,i)=>s.budgets[b]=num('b'+i)); s.budgets[n]=0; s.bucketOrder.push(n); persist(); openSettings(); };
  document.querySelectorAll('[data-delbk]').forEach(b=>b.onclick=()=>{ const name=BUCKETS[+b.dataset.delbk]; if(state.subcats.some(c=>c.bucket===name)){ if(!b.dataset.arm){ b.dataset.arm=1; b.textContent='세부분류도 옮겨져요. 삭제?'; return; } } if(BUCKETS.length<=1) return; const to=BUCKETS.find(x=>x!==name); state.subcats.forEach(c=>{ if(c.bucket===name) c.bucket=to; }); delete s.budgets[name]; s.bucketOrder=s.bucketOrder.filter(x=>x!==name); persist(); openSettings(); });
  $('#npAdd').onclick=()=>{ const v=$('#npTo').value; if(!v) return; state.plan.push({id:uid(),to:v,amount:0}); persist(); openSettings(); };
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(state)); toast('백업을 복사했어요'); }catch(e){ const t=$('#bkText'); t.hidden=false; t.value=JSON.stringify(state); t.select(); toast('복사가 막혀서 아래 텍스트를 직접 복사해 주세요'); } };
  $('#bkRestore').onclick=()=>{ const t=$('#bkText'); if(t.hidden||!t.value.trim()){ t.hidden=false; t.value=''; t.focus(); return; } try{ const o=JSON.parse(t.value); if(!o.accounts||!o.entries) throw 0; state=o; migrate(); persist(); closeDlg(); render(); toast('복원했어요'); }catch(e){ toast('백업 형식이 아니에요'); } };
  document.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>{ BUCKETS.forEach((x,i)=>s.budgets[x]=num('b'+i)); const k=b.dataset.reg; s.regular=s.regular||[]; s.regular=s.regular.includes(k)?s.regular.filter(x=>x!==k):[...s.regular,k]; persist(); openSettings(); });
  $('#lgOut').onclick=()=>{ closeDlg(); window.__logout(); };
  $('#sok').onclick=()=>{
    BUCKETS.forEach((b,i)=>s.budgets[b]=num('b'+i));
    s.dueDays={}; document.querySelectorAll('[data-dd]').forEach(i=>{ const v=+i.value.replace(/[^0-9]/g,''); if(v>=1&&v<=31) s.dueDays[i.dataset.dd]=v; });
    state.plan.forEach((p,i)=>p.amount=num('p'+i)); state.plan=state.plan.filter(p=>p.amount>0);
    s.emgGoal=num('eg'); s.payDay=Math.min(31,Math.max(1,num('pd')||25));
    persist(); closeDlg(); render(); toast('설정을 저장했어요');
  };
}

/* ================= nav ================= */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ view=b.dataset.v; calSel=null; if(location.hash.slice(1)!==view) history.replaceState(null,'','#'+view); render(); window.scrollTo(0,0); });
$('#fab').onclick=()=>openEntry(null,'spend');
window.addEventListener('hashchange',()=>{ const v=location.hash.slice(1); if(['today','money','pay','cal'].includes(v)){ view=v; render(); } });
setInterval(()=>{ if(!$('#scrim').classList.contains('open')) render(); }, 60000);

/* ================= storage ================= */
let saving=Promise.resolve(), dirty=false;
function persist(){
  if(!store) return; dirty=true;
  saving=saving.then(async()=>{ if(!dirty) return; dirty=false; try{ await store.save(JSON.parse(JSON.stringify(state))); $('#status').textContent=store.label; }catch(e){ $('#status').textContent='저장 실패 — 다시 시도해 주세요'; console.error(e); } });
}
const LS='money-desktop-v1';
function loginBox(msg){
  const st=$('#status');
  st.innerHTML=`<section class="win" style="text-align:left;margin:0 0 14px"><div class="tb navy"><span>로그인.exe</span></div><div class="body small" style="line-height:1.5">
    ${msg?`<div class="warn" style="margin-bottom:6px">${esc(msg)}</div>`:''}
    기록은 내 계정에만 저장돼요. 어느 기기에서 로그인해도 같은 기록이 보여요.
    <div style="display:flex;gap:6px;margin-top:10px"><button type="button" class="btn def" id="gIn">Google로 로그인</button></div>
    <fieldset><legend>또는 이메일</legend>
      <input id="em" class="in field" type="email" placeholder="이메일" autocomplete="username">
      <input id="pw" class="in field" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" style="margin-top:4px">
      <div style="display:flex;gap:6px;margin-top:6px"><button type="button" class="btn sm" id="eIn">로그인</button><button type="button" class="btn sm" id="eUp">처음이에요 (가입)</button></div>
    </fieldset></div></section>`;
  $('#gIn').onclick=async()=>{ const p=new GoogleAuthProvider(); try{ await signInWithPopup(auth,p); }catch(e){ if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')) await signInWithRedirect(auth,p); else loginBox('로그인 실패: '+(e.code||e.message)); } };
  $('#eIn').onclick=async()=>{ try{ await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value); }catch(e){ loginBox('로그인 실패: '+(e.code||e.message)); } };
  $('#eUp').onclick=async()=>{ try{ await createUserWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value); }catch(e){ loginBox('가입 실패: '+(e.code||e.message)); } };
}
async function init(){
  const v=location.hash.slice(1); if(['today','money','pay','cal'].includes(v)) view=v;
  try{ const l=JSON.parse(localStorage.getItem(LS)||'null'); state=(l&&l.accounts)?l:defaults(); }catch(e){ state=defaults(); }
  migrate();
  render();
  try{ await setPersistence(auth, browserLocalPersistence); }catch(e){}
  onAuthStateChanged(auth, async u=>{
    if(!u){ store=null; loginBox(); return; }
    $('#status').textContent='불러오는 중…';
    const ref=doc(fdb,'users',u.uid,'money','state');
    try{
      const snap=await getDoc(ref);
      if(snap.exists()&&snap.data().accounts) state=snap.data();
      const mig=migrate();
      store={label:'☁ 내 계정에 저장됨', save:o=>{ try{localStorage.setItem(LS,JSON.stringify(o));}catch(e){} return setDoc(ref,o); }};
      $('#status').textContent=store.label; render(); if(!snap.exists()||mig) persist(); if(mig) toast('고정지출 없이, 정기 지출 칸으로 정리했어요');
    }catch(e){ console.error(e); $('#status').textContent='불러오기 실패 — 인터넷 연결을 확인해 주세요'; }
  });
}
window.__logout=()=>signOut(auth);
init();
</script>
